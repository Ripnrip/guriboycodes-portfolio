<style>
/* Portfolio — 2026 */
:root {
  --bg: #07090c;
  --bg-2: #0c1015;
  --panel: #10141b;
  --panel-2: #161b24;
  --border: #2a3340;
  --border-2: #3c4756;
  --text: #e7ecf3;
  --text-2: #a9b4c2;
  --text-3: #6a7585;
  --accent: #5fe3c8;
  --accent-2: #7cd4ff;

  --cyan: #5fe3c8;
  --violet: #b39bff;
  --emerald: #7be0a4;
  --amber: #f5c46b;
  --rose: #ff9eb4;

  --font-display: "Instrument Serif", "EB Garamond", Georgia, serif;
  --font-sans: "Geist", "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

/* ===== THEME VARIATIONS ===== */
/* aurora = default (deep space + teal). Overrides below. */
:root[data-theme="ghibli"] {
  --bg: #14110c;
  --bg-2: #1b1710;
  --panel: #211c14;
  --panel-2: #2a241a;
  --border: #342c20;
  --border-2: #463b2b;
  --text: #f3ead8;
  --text-2: #c4b69c;
  --text-3: #8a7d66;
  --accent: #e0a86a;
  --accent-2: #9bb087;
  --cyan: #9bb087;
  --violet: #c9a86a;
  --emerald: #8fae7e;
  --amber: #e0a86a;
  --rose: #d99a7c;
}
:root[data-theme="ghibli"] body::before {
  background:
    radial-gradient(900px 600px at 15% -10%, rgba(224,168,106,0.10), transparent 60%),
    radial-gradient(800px 500px at 90% 10%, rgba(155,176,135,0.08), transparent 65%),
    radial-gradient(700px 700px at 50% 110%, rgba(217,154,124,0.06), transparent 60%);
}

:root[data-theme="mono"] {
  --bg: #050505;
  --bg-2: #0c0c0c;
  --panel: #111111;
  --panel-2: #181818;
  --border: #232323;
  --border-2: #333333;
  --text: #f2f2f2;
  --text-2: #a8a8a8;
  --text-3: #6a6a6a;
  --accent: #f2f2f2;
  --accent-2: #cfcfcf;
  --cyan: #e8e8e8;
  --violet: #cfcfcf;
  --emerald: #d8d8d8;
  --amber: #f2f2f2;
  --rose: #c0c0c0;
}
:root[data-theme="mono"] body::before { background: none; }

:root[data-grain="off"] body::after { display: none; }
:root[data-covers="off"] .flagship-cover { display: none; }
:root[data-covers="off"] .flagship-body.has-cover { grid-template-columns: 1.4fr 1fr; }
@media (max-width: 820px) {
  :root[data-covers="off"] .flagship-body.has-cover { grid-template-columns: 1fr; }
}

:root[data-theme="nocturne"] {
  --bg: #0a0814;
  --bg-2: #100c1f;
  --panel: #15102a;
  --panel-2: #1d1638;
  --border: #271f44;
  --border-2: #392d61;
  --text: #ece8fb;
  --text-2: #b3a9d6;
  --text-3: #756a99;
  --accent: #b39bff;
  --accent-2: #8ecbff;
  --cyan: #8ecbff;
  --violet: #b39bff;
  --emerald: #8fd6c4;
  --amber: #e6c068;
  --rose: #ff9ec8;
}
:root[data-theme="nocturne"] body::before {
  background:
    radial-gradient(900px 600px at 15% -10%, rgba(179,155,255,0.12), transparent 60%),
    radial-gradient(800px 500px at 90% 10%, rgba(142,203,255,0.08), transparent 65%),
    radial-gradient(700px 700px at 50% 110%, rgba(255,158,200,0.06), transparent 60%);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

/* film-grain backdrop */
body::before {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  background:
    radial-gradient(900px 600px at 15% -10%, rgba(95,227,200,0.08), transparent 60%),
    radial-gradient(800px 500px at 90% 10%, rgba(124,212,255,0.06), transparent 65%),
    radial-gradient(700px 700px at 50% 110%, rgba(179,155,255,0.05), transparent 60%);
  z-index: 0;
}
body::after {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  opacity: 0.4;
  z-index: 1;
  background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxNjAnIGhlaWdodD0nMTYwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC45JyBudW1PY3RhdmVzPScyJyBzdGl0Y2hUaWxlcz0nc3RpdGNoJy8+PGZlQ29sb3JNYXRyaXggdmFsdWVzPScwIDAgMCAwIDAuNiAwIDAgMCAwIDAuNyAwIDAgMCAwIDAuOCAwIDAgMCAwLjA1IDAnLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJyBmaWx0ZXI9J3VybCglMjNuKScvPjwvc3ZnPg==");
}
#root { position: relative; z-index: 2; }

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }

/* ---------- shared layout ---------- */
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 32px; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-3);
}
.section-title {
  font-family: var(--font-display);
  font-size: clamp(36px, 5vw, 64px);
  line-height: 1.02;
  letter-spacing: -0.02em;
  margin: 0 0 24px;
  font-weight: 400;
  font-style: italic;
}
.section-title em { font-style: normal; color: var(--accent); }

section.bay { padding: 120px 0; position: relative; }
section.bay + section.bay { border-top: 1px solid var(--border); }

/* ---------- nav ---------- */
.nav {
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  background: rgba(7, 9, 12, 0.72);
  border-bottom: 1px solid var(--border);
}
.nav-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 14px 32px;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-brand {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.04em;
}
.nav-brand .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 12px var(--accent);
  animation: pulse 2.2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.55; transform: scale(0.85); }
}
.nav-links { display: flex; gap: 28px; }
.nav-links a {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-2);
  transition: color 0.18s;
}
.nav-links a:hover { color: var(--text); }
.nav-cta {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 9px 16px;
  border: 1px solid var(--border-2);
  border-radius: 999px;
  color: var(--text);
  transition: all 0.18s;
}
.nav-cta:hover { background: var(--accent); color: #0a0d12; border-color: var(--accent); }

@media (max-width: 720px) {
  .nav-links { display: none; }
}

/* ---------- hero ---------- */
.hero { padding: 100px clamp(24px, 5vw, 64px) 80px; }
.hero-grid {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 64px;
  align-items: center;
}
@media (max-width: 920px) {
  .hero-grid { grid-template-columns: 1fr; gap: 40px; }
}
.hero-name {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(56px, 8.5vw, 124px);
  line-height: 0.95;
  letter-spacing: -0.025em;
  margin: 18px 0 6px;
}
.hero-name .ital { font-style: italic; color: var(--accent); }
.hero-role {
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-2);
  margin: 0 0 28px;
}
.hero-pitch {
  font-family: var(--font-display);
  font-size: clamp(22px, 2.3vw, 28px);
  line-height: 1.35;
  color: var(--text);
  margin: 0 0 16px;
  font-style: italic;
  max-width: 56ch;
}
.hero-pitch-alt {
  font-size: 15px;
  color: var(--text-2);
  max-width: 56ch;
  margin: 0 0 32px;
}
.hero-meta {
  display: flex; gap: 24px; align-items: center; flex-wrap: wrap;
  font-family: var(--font-mono); font-size: 12px; color: var(--text-3);
  letter-spacing: 0.04em;
}
.hero-meta .live-dot {
  display: inline-block;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--emerald); margin-right: 8px;
  box-shadow: 0 0 8px var(--emerald);
  animation: pulse 2.4s ease-in-out infinite;
}

.hero-portrait {
  position: relative;
  aspect-ratio: 1 / 1.05;
  border-radius: 16px;
  overflow: hidden;
  background: var(--panel);
  border: 1px solid var(--border);
}
.hero-portrait img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: opacity 0.6s ease, transform 0.8s ease;
}
.hero-portrait .alt {
  position: absolute; inset: 0;
  opacity: 0;
}
.hero-portrait:hover .ghibli { opacity: 0; }
.hero-portrait:hover .alt { opacity: 1; }
.hero-portrait-meta {
  position: absolute; bottom: 12px; left: 12px; right: 12px;
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: rgba(255,255,255,0.78);
  padding: 8px 12px;
  background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
  border-radius: 8px;
}

/* ---------- stats strip ---------- */
.stats {
  margin-top: 64px;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
@media (max-width: 920px) { .stats { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 540px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.stat {
  padding: 24px 18px;
  border-right: 1px solid var(--border);
  position: relative;
}
.stat:last-child { border-right: none; }
.stat-value {
  font-family: var(--font-display);
  font-size: 28px;
  font-style: italic;
  color: var(--text);
  letter-spacing: -0.01em;
  line-height: 1;
}
.stat-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-top: 8px;
}

/* ---------- flagship ---------- */
.flagship-list {
  display: flex; flex-direction: column;
  gap: 24px; margin-top: 56px;
}
.flagship {
  position: relative;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
  overflow: hidden;
  transition: border-color 0.2s, transform 0.2s;
}
.flagship:hover { border-color: var(--border-2); }
.flagship-head {
  display: grid;
  grid-template-columns: 64px 1fr auto;
  align-items: center;
  gap: 20px;
  padding: 22px 28px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
}
.flagship-num {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 36px;
  color: var(--accent-c, var(--cyan));
  line-height: 1;
}
.flagship-title-row {
  display: flex; flex-direction: column; gap: 4px; min-width: 0;
}
.flagship-codename {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-3);
}
.flagship-codename .pill {
  padding: 3px 9px; border-radius: 999px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border-2);
  color: var(--text-2);
  font-size: 10px;
}
.flagship-codename .pill.live::before {
  content: ""; display: inline-block; width: 6px; height: 6px;
  border-radius: 50%; background: var(--emerald);
  margin-right: 6px; vertical-align: middle;
  box-shadow: 0 0 6px var(--emerald);
}
.flagship-title {
  font-family: var(--font-display);
  font-size: 26px; line-height: 1.2;
  letter-spacing: -0.01em;
  margin: 0;
  font-weight: 400;
}
.flagship-title .ital { font-style: italic; color: var(--accent-c, var(--cyan)); }
.flagship-window {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-3); letter-spacing: 0.04em;
  white-space: nowrap;
}
.flagship-body {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 32px;
  padding: 28px;
}
@media (max-width: 820px) { .flagship-body { grid-template-columns: 1fr; gap: 20px; } }
.flagship-tagline {
  font-family: var(--font-display);
  font-size: 20px; font-style: italic;
  color: var(--text); margin: 0 0 14px;
  line-height: 1.35;
}
.flagship-story {
  font-size: 14.5px; color: var(--text-2); margin: 0 0 18px;
  line-height: 1.65; max-width: 60ch;
}
.flagship-midyear {
  margin: 0 0 16px;
  padding: 10px 14px;
  border-left: 2px solid var(--accent-c, var(--cyan));
  background: rgba(255,255,255,0.025);
  border-radius: 0 6px 6px 0;
}
.flagship-midyear-label {
  display: block;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent-c, var(--cyan));
  margin-bottom: 5px;
}
.flagship-midyear-text {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.6;
  margin: 0;
}
.flagship-sponsor {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-3); letter-spacing: 0.04em;
  margin: 0 0 16px;
}
.flagship-sponsor .label { color: var(--accent-c, var(--cyan)); }
.flagship-stack {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.flagship-stack .chip {
  padding: 5px 10px; font-family: var(--font-mono);
  font-size: 10.5px; letter-spacing: 0.04em;
  border: 1px solid var(--border-2);
  border-radius: 6px; color: var(--text-2);
  background: rgba(255,255,255,0.02);
}

.flagship-metrics {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1px; background: var(--border);
  border-radius: 10px; overflow: hidden;
}
.metric {
  padding: 16px 18px; background: var(--panel-2);
}
.metric-k {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-3); margin-bottom: 6px;
}
.metric-v {
  font-family: var(--font-display); font-style: italic;
  font-size: 22px; color: var(--accent-c, var(--cyan));
  line-height: 1.1;
}

.flagship-vocab {
  margin-top: 18px;
  display: flex; flex-wrap: wrap; gap: 6px;
}
.flagship-vocab .vchip {
  padding: 4px 10px;
  font-family: var(--font-display);
  font-style: italic; font-size: 13px;
  border-radius: 999px;
  background: rgba(255,255,255,0.03);
  border: 1px dashed var(--border-2);
  color: var(--text-2);
}

/* ---------- experience timeline ---------- */
.timeline {
  margin-top: 48px;
  position: relative;
  padding-left: 32px;
}
.timeline::before {
  content: ""; position: absolute;
  left: 7px; top: 8px; bottom: 8px;
  width: 1px; background: var(--border-2);
}
.t-item {
  position: relative;
  padding: 24px 0 32px;
  border-bottom: 1px solid var(--border);
}
.t-item:last-child { border-bottom: none; }
.t-item::before {
  content: ""; position: absolute;
  left: -32px; top: 32px;
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--accent);
  box-shadow: 0 0 0 4px rgba(95,227,200,0.1);
}
.t-head {
  display: flex; justify-content: space-between; align-items: center;
  gap: 24px; flex-wrap: wrap;
  margin-bottom: 16px;
}
.t-co {
  display: flex; align-items: center; gap: 14px;
}
.t-logo {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: white;
  padding: 6px;
  display: flex; align-items: center; justify-content: center;
}
.t-logo img { max-width: 100%; max-height: 100%; }
.t-company {
  font-family: var(--font-display); font-size: 24px;
  font-style: italic; line-height: 1;
}
.t-role {
  font-family: var(--font-mono); font-size: 12px;
  color: var(--text-2); letter-spacing: 0.04em;
  margin-top: 4px;
}
.t-window {
  font-family: var(--font-mono); font-size: 12px;
  color: var(--text-3); letter-spacing: 0.04em;
}
.t-bullets { margin: 0; padding: 0; list-style: none; }
.t-bullets li {
  position: relative;
  padding-left: 18px;
  font-size: 14.5px; color: var(--text-2);
  line-height: 1.6;
  margin-bottom: 6px;
}
.t-bullets li::before {
  content: "→"; position: absolute; left: 0;
  color: var(--accent); font-family: var(--font-mono);
}

/* ---------- skills grid ---------- */
.skills-cols {
  margin-top: 48px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
}
@media (max-width: 920px) { .skills-cols { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 540px) { .skills-cols { grid-template-columns: 1fr; } }
.skill-col {
  border-top: 1px solid var(--border-2);
  padding-top: 18px;
}
.skill-group {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 18px;
}
.skill-list {
  display: flex; flex-direction: column; gap: 10px;
}
.skill-item {
  display: flex; align-items: center; gap: 11px;
  font-size: 14px; color: var(--text-2);
}
.skill-item img {
  width: 26px; height: 26px;
  object-fit: contain;
  background: #eef1f6;
  border: 1px solid rgba(255,255,255,0.5);
  border-radius: 7px;
  padding: 4px;
  flex-shrink: 0;
}

/* ---------- hackathons ---------- */
.hacks {
  margin-top: 48px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
@media (max-width: 820px) { .hacks { grid-template-columns: repeat(2, 1fr); } }
.hack {
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--panel);
}
.hack-place {
  font-family: var(--font-display); font-style: italic;
  font-size: 28px; color: var(--accent);
  line-height: 1;
}
.hack-flag { font-size: 22px; margin-left: 8px; }
.hack-name {
  font-family: var(--font-display); font-size: 18px;
  margin: 12px 0 4px;
}
.hack-year {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-3); letter-spacing: 0.04em;
}
.hack-desc {
  font-size: 13px; color: var(--text-2);
  margin-top: 10px; line-height: 1.55;
}

/* ---------- footer ---------- */
.footer {
  padding: 64px 0 48px;
  border-top: 1px solid var(--border);
  margin-top: 40px;
}
.footer-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 40px;
}
@media (max-width: 720px) { .footer-grid { grid-template-columns: 1fr; } }
.footer-pitch {
  font-family: var(--font-display);
  font-style: italic;
  font-size: clamp(28px, 4vw, 44px);
  line-height: 1.15;
  letter-spacing: -0.01em;

  color: var(--text);
}
.footer-pitch em { color: var(--accent); font-style: normal; }
.footer-col h4 {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-3); margin: 0 0 14px;
}
.footer-col a {
  display: block; padding: 6px 0;

}
.footer-col a:hover { color: var(--accent); border-color: var(--accent); }
.footer-mini {
  margin-top: 48px;
  display: flex; justify-content: space-between;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-3); letter-spacing: 0.04em;

/* ---------- flagship cover + mid-year ---------- */
.flagship-body.has-cover {
  grid-template-columns: 150px 1.3fr 1fr;
}
@media (max-width: 820px) {
  .flagship-body.has-cover { grid-template-columns: 1fr; }
}
.flagship-cover {
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border-2);
  background: var(--panel-2);
  position: relative;
  min-height: 220px;
}
.flagship-cover svg { width: 100%; height: 100%; display: block; }
.flagship-cover-art { position: absolute; inset: 0; z-index: 0; }
.flagship-cover image-slot { z-index: 1; }
.flagship-cover image-slot::part(frame) { background: transparent; }
.flagship-cover image-slot::part(ring) { display: none; }
.flagship-cover image-slot::part(empty) {
  opacity: 0;
  color: #eef2f8;
  background: linear-gradient(to top, rgba(7, 9, 12, 0.82), rgba(7, 9, 12, 0.3));

}
.flagship-cover image-slot:hover::part(empty) { opacity: 1; }
.flagship-cover .cover-tag { z-index: 2; pointer-events: none; }
.flagship-cover .cover-tag {
  position: absolute; bottom: 8px; left: 8px; right: 8px;
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: rgba(255,255,255,0.82);
  padding: 5px 8px; border-radius: 6px;
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}
@media (max-width: 820px) {
  .flagship-cover { min-height: 160px; }
}

/* ---------- mid-year shipped grid ---------- */
.shipped-grid {
  margin-top: 48px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
@media (max-width: 900px) { .shipped-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .shipped-grid { grid-template-columns: 1fr; } }
.shipped-card {
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--panel);
  transition: border-color 0.2s, transform 0.2s;
}
.shipped-card:hover { border-color: var(--border-2); transform: translateY(-2px); }
.shipped-tag {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 12px;
  display: inline-block;
  padding: 3px 9px; border-radius: 999px;
  background: color-mix(in oklab, var(--accent) 10%, transparent);
  border: 1px solid color-mix(in oklab, var(--accent) 25%, transparent);
}
.shipped-name {
  font-family: var(--font-display); font-size: 21px;
  font-style: italic; margin: 0 0 8px; line-height: 1.1;
}
.shipped-desc {
  font-size: 13.5px; color: var(--text-2); line-height: 1.6; margin: 0;
}


/* Ask My Brain — RAG + knowledge graph */

.brain {
  margin-top: 56px;
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: 24px;
}
@media (max-width: 920px) { .brain { grid-template-columns: 1fr; } }

.brain-panel {
  border: 1px solid var(--border);
  border-radius: 18px;
  background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
  overflow: hidden;
  display: flex; flex-direction: column;
  min-height: 540px;
}

.brain-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 22px;
  border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,0.015);
}
.brain-head-l {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-2);
}
.brain-head-l .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 8px var(--accent);
  animation: pulse 2.4s ease-in-out infinite;
}
.brain-head-r {
  font-family: var(--font-mono); font-size: 10.5px;
  color: var(--text-3); letter-spacing: 0.06em;
}

/* ===== CHAT side ===== */
.brain-chat-body {
  flex: 1;
  overflow-y: auto;
  padding: 22px;
  display: flex; flex-direction: column; gap: 14px;
  min-height: 0;
}
.brain-chat-body::-webkit-scrollbar { width: 6px; }
.brain-chat-body::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }

.msg { max-width: 92%; }
.msg-role {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-3); margin-bottom: 6px;
}
.msg-bubble {
  padding: 14px 16px;
  border-radius: 12px;
  font-size: 14.5px;
  line-height: 1.55;
}
.msg.user {
  align-self: flex-end;
  max-width: 80%;
}
.msg.user .msg-role { text-align: right; color: var(--accent); }
.msg.user .msg-bubble {
  background: linear-gradient(135deg, rgba(95,227,200,0.12), rgba(124,212,255,0.08));
  border: 1px solid rgba(95,227,200,0.25);
  color: var(--text);
}
.msg.brain .msg-bubble {
  background: var(--panel-2);
  border: 1px solid var(--border-2);
  color: var(--text);
}

.msg-sources {
  margin-top: 10px;
  display: flex; flex-wrap: wrap; gap: 6px;
}
.src-chip {
  font-family: var(--font-mono); font-size: 10px;
  padding: 3px 8px; border-radius: 999px;
  background: rgba(95,227,200,0.08);
  border: 1px solid rgba(95,227,200,0.25);
  color: var(--accent);
  cursor: pointer;
  transition: all 0.15s;
}
.src-chip:hover {
  background: rgba(95,227,200,0.2);
  color: var(--text);
}
.src-chip.active {
  background: var(--accent); color: #07090c;
}

.brain-empty {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 32px;
  color: var(--text-3);
}
.brain-empty .glow {
  width: 56px; height: 56px; border-radius: 50%;
  background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
  opacity: 0.55;
  margin-bottom: 16px;
  animation: pulse 2.6s ease-in-out infinite;
}
.brain-empty h4 {
  font-family: var(--font-display); font-style: italic;
  font-size: 26px; color: var(--text);
  margin: 0 0 6px; font-weight: 400;
}
.brain-empty p {
  font-size: 13px; max-width: 38ch; margin: 0;
}

.examples {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-top: 22px; justify-content: center;
  max-width: 480px;
}
.examples button {
  padding: 8px 13px;
  font-family: var(--font-mono); font-size: 11px;
  border: 1px solid var(--border-2);
  background: rgba(255,255,255,0.02);
  color: var(--text-2);
  border-radius: 999px;
  transition: all 0.15s;
}
.examples button:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(95,227,200,0.06);
}

.brain-input-row {
  display: flex; gap: 8px;
  padding: 14px;
  border-top: 1px solid var(--border);
  background: var(--bg-2);
}
.brain-input {
  flex: 1;
  padding: 12px 14px;
  background: var(--panel);
  border: 1px solid var(--border-2);
  border-radius: 10px;
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
}
.brain-input:focus { border-color: var(--accent); }
.brain-send {
  padding: 12px 18px;
  border-radius: 10px;
  background: var(--accent);
  color: #07090c;
  border: none;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 600;
  transition: opacity 0.15s;
}
.brain-send:hover:not(:disabled) { opacity: 0.85; }
.brain-send:disabled { opacity: 0.4; cursor: not-allowed; }

.typing-dot {
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  margin: 0 2px;
  animation: typing 1.2s infinite ease-in-out;
}
.typing-dot:nth-child(2) { animation-delay: 0.15s; }
.typing-dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes typing {
  0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-3px); }
}

/* ===== GRAPH side ===== */
.brain-graph {
  position: relative;
  min-height: 540px;
}
.brain-graph svg {
  display: block;
  width: 100%; height: 100%;
}
.brain-graph .node-g {
  cursor: pointer;
  transition: filter 0.2s;
}
.brain-graph .node-g:hover { filter: brightness(1.4); }
.brain-graph .node-circle {
  fill: var(--panel-2);
  stroke: var(--border-2);
  stroke-width: 1.5;
  transition: all 0.3s ease;
}
.brain-graph .node-g.active .node-circle {
  fill: var(--accent);
  stroke: var(--accent);
  filter: drop-shadow(0 0 12px rgba(95,227,200,0.7));
}
.brain-graph .node-g.dimmed { opacity: 0.18; }
.brain-graph .node-label {
  font-family: var(--font-mono);
  font-size: 10px;
  fill: var(--text-2);
  letter-spacing: 0.04em;
  pointer-events: none;
}
.brain-graph .node-g.active .node-label { fill: var(--text); font-weight: 600; }
.brain-graph .edge {
  stroke: var(--border-2);
  stroke-width: 1;
  transition: all 0.3s ease;
}
.brain-graph .edge.active {
  stroke: var(--accent);
  stroke-width: 1.8;
  filter: drop-shadow(0 0 4px rgba(95,227,200,0.5));
}
.brain-graph .edge.dimmed { opacity: 0.08; }

.graph-overlay {
  position: absolute; bottom: 14px; left: 14px; right: 14px;
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-3); letter-spacing: 0.06em;
  pointer-events: none;
}
.graph-legend { display: flex; gap: 14px; }
.graph-legend span {
  display: flex; align-items: center; gap: 5px;
}
.graph-legend i {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block;
}
.lg-system { background: var(--cyan); }
.lg-program { background: var(--violet); }
.lg-tech { background: var(--emerald); }
.lg-metric { background: var(--amber); }
.lg-milestone { background: var(--rose); }


/* Consolidated portfolio — side projects, media reel, philosophy, d3 graph, layouts */

.lede {
  color: var(--text-2);
  max-width: 64ch;
  font-size: 16px;
  line-height: 1.7;
  margin: 0;
}

/* ============ SIDE PROJECTS ============ */
.sp-filter {
  margin: 40px 0 32px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.sp-filter-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 15px;
  border-radius: 999px;
  border: 1px solid var(--border-2);
  background: rgba(255, 255, 255, 0.02);
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  transition: all 0.18s;
}
.sp-filter-btn:hover { color: var(--text); border-color: var(--text-3); }
.sp-filter-btn.active {
  background: var(--accent);
  color: #07090c;
  border-color: var(--accent);
}
.sp-filter-n {
  font-size: 10px;
  opacity: 0.6;
}
.sp-filter-btn.active .sp-filter-n { opacity: 0.8; }

.sp-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
@media (max-width: 920px) { .sp-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .sp-grid { grid-template-columns: 1fr; } }
@media (max-width: 560px) {
  .sp-title { font-size: 17px; }
  .sp-one { font-size: 14px; }
  .sp-meta { padding: 14px 16px 16px; }
}

.sp-card {
  display: flex;
  flex-direction: column;
  text-align: left;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--panel);
  color: var(--text);

}
.sp-card:hover { border-color: var(--border-2); transform: translateY(-3px); }

  overflow: hidden;
  background: var(--panel-2);
}
.sp-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;

}
.sp-card:hover .sp-art img { transform: scale(1.06); }
.sp-art-grad {
  position: absolute;
  inset: 0;

}
.sp-cat-chip {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 2;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 5px 12px;

  background: linear-gradient(135deg, color-mix(in oklab, var(--accent) 32%, rgba(7,9,12,0.72)), rgba(7,9,12,0.66));
  backdrop-filter: blur(8px);
  border: 1px solid color-mix(in oklab, var(--accent) 50%, transparent);

.sp-card:hover .sp-cat-chip {

.sp-meta { padding: 18px 20px 20px; position: relative; z-index: 1; background: var(--panel); overflow: hidden; min-width: 0; }
.sp-title-row {

}
.sp-title {

.sp-one {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 16px;
  line-height: 1.35;
  color: var(--accent);
  margin: 8px 0 14px;
  word-break: break-word;
  overflow-wrap: break-word;

.sp-tech {

}
.sp-tech span {
  font-family: var(--font-mono);

/* ============ HACKATHON REEL ============ */
.reel-grid {
  margin-top: 44px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
@media (max-width: 920px) { .reel-grid { grid-template-columns: 1fr; max-width: 480px; } }
.reel-card {
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--panel);
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.2s, transform 0.2s;
}
.reel-card:hover { border-color: var(--border-2); transform: translateY(-3px); }
.reel-thumb {
  position: relative;
  aspect-ratio: 16 / 9;
  background: #000;
  overflow: hidden;
}
.reel-thumb video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.62;
  transition: opacity 0.3s;
}
.reel-card:hover .reel-thumb video { opacity: 1; }
.reel-still {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.6s ease;
  z-index: 1;
}
.reel-thumb .reel-thumb-grad, .reel-thumb .reel-play, .reel-thumb .reel-place { z-index: 2; }
.reel-thumb-grad {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(to top, rgba(7, 9, 12, 0.5), transparent 50%);
}
.reel-play {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.reel-play span {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: rgba(7, 9, 12, 0.6);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  padding-left: 3px;
  transition: transform 0.2s, background 0.2s;
}
.reel-card:hover .reel-play span { transform: scale(1.1); background: var(--accent); color: #07090c; }
.reel-place {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 2;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 999px;
  background: color-mix(in oklab, var(--accent) 88%, #000);
  color: #07090c;
  font-weight: 600;
}
.reel-meta { padding: 16px 18px 18px; }
.reel-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.reel-title {
  font-family: var(--font-display);
  font-size: 20px;
  margin: 0;
  font-weight: 400;
}
.reel-flag { font-size: 18px; }
.reel-event {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.04em;
  color: var(--accent);
  margin: 4px 0 8px;
}
.reel-note {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.55;
  margin: 0;
}

/* video modal */
.vid-modal-card {
  position: relative;
  width: min(960px, 100%);
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--border-2);
  background: #000;
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7);
}
.vid-modal-card video {
  display: block;
  width: 100%;
  max-height: 78vh;
  background: #000;
}
.vid-modal-cap {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 14px 18px;
  background: var(--panel);
  border-top: 1px solid var(--border);
}
.vid-modal-title {
  font-family: var(--font-display);
  font-size: 18px;
}
.vid-modal-event {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-3);
}

/* ============ EASTER EGG ============ */
.egg-trigger {
  position: fixed;
  bottom: 16px;
  left: 16px;
  z-index: 120;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 13px 8px 11px;
  border-radius: 999px;
  border: 1px solid color-mix(in oklab, var(--accent) 35%, transparent);
  background: color-mix(in oklab, var(--accent) 12%, var(--bg));
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  opacity: 0.35;
  transition: opacity 0.25s, transform 0.2s, background 0.2s;
}
.egg-trigger:hover {
  opacity: 1;
  transform: translateY(-2px);
  background: color-mix(in oklab, var(--accent) 22%, var(--bg));
}
.egg-eyes { font-size: 15px; filter: grayscale(0.2); }

/* ============ PHILOSOPHY / WORKING ============ */
.working-quote {
  font-family: var(--font-display);
  font-style: italic;
  font-size: clamp(22px, 3vw, 34px);
  line-height: 1.3;
  color: var(--text);
  max-width: 24ch;
  margin: 8px 0 44px;
}
.working-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
@media (max-width: 820px) { .working-grid { grid-template-columns: 1fr; } }
.working-card {
  padding: 26px 24px 28px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
}
.working-num {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 30px;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 14px;
}
.working-title {
  font-family: var(--font-display);
  font-size: 23px;
  margin: 0 0 10px;
  font-weight: 400;
}
.working-body {
  font-size: 14px;
  color: var(--text-2);
  line-height: 1.65;
  margin: 0;
}
.working-egg-hint {
  margin-top: 30px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  border-radius: 12px;
  border: 1px dashed var(--border-2);
  background: rgba(255, 255, 255, 0.015);
  font-size: 14px;
  color: var(--text-2);
}
.working-egg-hint em { color: var(--accent); font-style: italic; }
.working-egg-eyes { font-size: 20px; }

/* ============ D3 KNOWLEDGE GRAPH ============ */
.kg-wrap { position: absolute; inset: 0; }
.kg-wrap svg { width: 100%; height: 100%; display: block; cursor: grab; }
.kg-wrap svg:active { cursor: grabbing; }

.kg-link {
  stroke: var(--border-2);
  stroke-width: 1;
  transition: stroke 0.3s, stroke-opacity 0.3s;
}
.kg-link.kg-hub { stroke: var(--border-2); stroke-opacity: 0.5; stroke-width: 1.4; }
.kg-link.kg-skill { stroke: var(--border); stroke-opacity: 0.32; }
.kg-link.kg-cross { stroke: var(--border-2); stroke-opacity: 0.22; stroke-dasharray: 2 4; }
.kg-link.kg-link-active { stroke: var(--accent); stroke-opacity: 0.85; stroke-width: 1.8; }
.kg-link.kg-link-dim { stroke-opacity: 0.05; }

.kg-node { cursor: pointer; }
.kg-core {
  fill: var(--panel-2);
  stroke: var(--c, var(--accent));
  stroke-width: 1.6;
  transition: fill 0.3s, filter 0.3s;
}
.kg-node.kg-center .kg-core { fill: var(--accent); stroke: var(--accent); }
.kg-node.kg-system .kg-core { fill: color-mix(in oklab, var(--c) 26%, var(--panel-2)); stroke-width: 2; }
.kg-node.kg-category .kg-core { fill: color-mix(in oklab, var(--c) 14%, var(--panel-2)); stroke-width: 2; }
.kg-icon-bg {
  fill: #eef1f6;
  stroke: rgba(255, 255, 255, 0.55);
  stroke-width: 1;
}
.kg-center-letter {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 20px;
  fill: #07090c;
  pointer-events: none;
}
.kg-sys-letter {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 16px;
  fill: var(--text);
  pointer-events: none;
}
.kg-skill-bg {
  fill: #eef1f6;
  stroke: rgba(255, 255, 255, 0.5);
  stroke-width: 1;
  transition: stroke 0.3s, fill 0.3s, filter 0.3s;
}
.kg-node.kg-skill image { opacity: 1; transition: opacity 0.3s; }
.kg-label {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.03em;
  fill: var(--text-2);
  pointer-events: none;
  paint-order: stroke;
  stroke: var(--bg);
  stroke-width: 3px;
  stroke-linejoin: round;
}
.kg-node.kg-system .kg-core { filter: drop-shadow(0 0 6px color-mix(in oklab, var(--c) 50%, transparent)); }

/* highlight states */
.kg-node.kg-active .kg-core {
  fill: var(--c, var(--accent));
  filter: drop-shadow(0 0 12px var(--c, var(--accent)));
}
.kg-node.kg-active .kg-skill-bg {
  stroke: var(--c, var(--accent));
  stroke-width: 2.5;
  filter: drop-shadow(0 0 10px color-mix(in oklab, var(--c) 65%, transparent));
}
.kg-node.kg-active.kg-skill image { opacity: 1; }
.kg-node.kg-active .kg-label { fill: var(--text); font-weight: 600; }
.kg-node.kg-dim { opacity: 0.18; }
.kg-node.kg-hidden, .kg-link.kg-hidden { display: none; }

/* ============ LAYOUT NUANCES ============ */
:root[data-layout="showcase"] .hero { padding: 72px clamp(24px, 5vw, 64px) 56px; }
:root[data-layout="impact"] .hero { padding: 80px clamp(24px, 5vw, 64px) 56px; }
:root[data-layout="impact"] .hero-pitch-alt { font-size: 16px; }

/* ============ HACKATHONS SECTION ============ */
.hk-stats {
  margin: 40px 0 56px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
@media (max-width: 560px) { .hk-stats { grid-template-columns: repeat(2, 1fr); } }
.hk-stat {
  padding: 22px 18px;
  border-right: 1px solid var(--border);
}
.hk-stat:last-child { border-right: none; }
.hk-stat-v {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 38px;
  line-height: 1;
  color: var(--accent);
}
.hk-stat-l {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-top: 10px;
}

.hk-reel-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-3);
  margin: 0 0 18px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.hk-reel-label::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}
.hk-grid {
  margin-top: 18px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
@media (max-width: 860px) { .hk-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .hk-grid { grid-template-columns: 1fr; } }
.hk-card {
  padding: 22px 22px 24px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--panel);
  min-height: 168px;
  display: flex;
  flex-direction: column;
  transition: border-color 0.2s, transform 0.2s;
}
.hk-card:hover { border-color: var(--border-2); transform: translateY(-2px); }
.hk-card.has-img { padding-top: 0; overflow: hidden; }
.hk-thumb { margin: 0 -22px 16px; height: 112px; overflow: hidden; background: var(--panel-2); }
.hk-thumb.cycle { position: relative; }
.hk-thumb.cycle img { position: absolute; inset: 0; transition: opacity 0.7s ease; }
.hk-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; transition: transform 0.5s ease; }
.hk-card.has-img:hover .hk-thumb img { transform: scale(1.05); }
.hk-card.win {
  background: linear-gradient(180deg, color-mix(in oklab, var(--accent) 9%, var(--panel)) 0%, var(--panel) 100%);
  border-color: color-mix(in oklab, var(--accent) 30%, transparent);
}
.hk-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.hk-place {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--border-2);
  color: var(--text-2);
}
.hk-card.win .hk-place {
  background: var(--accent);
  color: #07090c;
  border-color: var(--accent);
  font-weight: 600;
}
.hk-flag { font-size: 20px; }
.hk-name {
  font-family: var(--font-display);
  font-size: 19px;
  line-height: 1.15;
  margin: 14px 0 4px;
}
.hk-year {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: 0.04em;
}
.hk-desc {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.55;
  margin: 10px 0 0;
}

/* ============ MAGIC-UI EFFECTS ============ */
/* nav + theme toggle */
.nav-right { display: flex; align-items: center; gap: 14px; }
.theme-toggle {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--border-2); background: transparent;
  color: var(--text-2); font-size: 14px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: color 0.18s, border-color 0.18s, transform 0.18s;
}
.theme-toggle:hover { color: var(--accent); border-color: var(--accent); transform: rotate(-12deg); }

/* typing */
.typing-caret {
  display: inline-block; width: 2px; height: 0.92em;
  background: var(--accent); margin-left: 3px; vertical-align: -1px;
  animation: tw-caret 1s steps(1) infinite;
}
@keyframes tw-caret { 50% { opacity: 0; } }

/* shiny text */
.shiny-text {
  background: linear-gradient(110deg, currentColor 0 38%, #ffffff 50%, currentColor 62% 100%);
  background-size: 220% 100%;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  animation: shiny 3s linear infinite;
}
@keyframes shiny { to { background-position: -220% 0; } }

/* reveal */
.reveal { opacity: 0; transform: translateY(16px); transition: opacity 0.6s ease, transform 0.6s ease; }
.reveal.in { opacity: 1; transform: none; }
.sp-grid .reveal { height: 100%; }
.sp-card { width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
}

/* skills marquee */
.skills-marquee-wrap { margin-top: 44px; }
.sk-marquee {
  display: flex; flex-direction: column; gap: 14px;
  -webkit-mask: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
  mask: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
}
.sk-track { overflow: hidden; }
.sk-row { display: flex; gap: 12px; width: max-content; animation: sk-marq 52s linear infinite; }
.sk-row.rev { animation-direction: reverse; }
.sk-marquee:hover .sk-row { animation-play-state: paused; }
@keyframes sk-marq { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.sk-chip {
  display: inline-flex; align-items: center; gap: 9px;
  padding: 8px 15px 8px 8px; border-radius: 999px;
  border: 1px solid var(--border-2); background: var(--panel);
  white-space: nowrap;
}
.sk-chip img {
  width: 24px; height: 24px; object-fit: contain;
  background: #eef1f6; border: 1px solid rgba(120, 130, 145, 0.4);
  border-radius: 6px; padding: 3px; flex-shrink: 0;
}
.sk-chip span { font-family: var(--font-mono); font-size: 13px; color: var(--text-2); letter-spacing: 0.01em; }
@media (prefers-reduced-motion: reduce) { .sk-row { animation: none; } .sk-marquee { mask: none; -webkit-mask: none; } }

/* border-beam on featured project cards */
@property --beam { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
.sp-card.shine { position: relative; }
.sp-card .shine-border {
  position: absolute; inset: 0; border-radius: 16px; padding: 1.6px;
  pointer-events: none; z-index: 4;
  background: conic-gradient(from var(--beam), transparent 0 68%, var(--accent) 84%, #fff 90%, transparent 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: beam-rotate 4.5s linear infinite;
}
@keyframes beam-rotate { to { --beam: 360deg; } }
@media (prefers-reduced-motion: reduce) { .sp-card .shine-border { animation: none; opacity: 0.5; } }

/* globe */
.hk-globe-block { margin: 8px 0 36px; display: flex; justify-content: center; }
.globe-inner { display: flex; flex-direction: column; align-items: center; }
.globe-wrap { width: min(400px, 78vw); aspect-ratio: 1; position: relative; }
.globe-canvas { width: 100%; height: 100%; display: block; }
.globe-pins {
  display: flex; flex-wrap: wrap; gap: 7px 14px; justify-content: center;
  margin-top: 18px; max-width: 560px;
  font-family: var(--font-mono); font-size: 11px; color: var(--text-3); letter-spacing: 0.03em;
}
.globe-pins span { transition: color 0.18s; }
.globe-pins span:hover { color: var(--accent); }

/* graph chips read on light or dark */
.kg-skill-bg, .kg-icon-bg { stroke: rgba(120, 130, 145, 0.4); }

/* ============ LIGHT MODE ============ */
:root[data-mode="light"] {
  --bg: #faf9f5; --bg-2: #f1efe8; --panel: #ffffff; --panel-2: #f5f3ed;
  --border: #dad6cc; --border-2: #c4bfb2;
  --text: #181b20; --text-2: #3f454e; --text-3: #6b717b;
  --accent: #0c7d6e !important; --accent-2: #0a6ea0 !important;
  --cyan: #0c7d6e !important; --violet: #6a45d0 !important;
  --emerald: #1f8a5b !important; --amber: #9a6a12 !important; --rose: #c2456b !important;
}
:root[data-mode="light"] body::before { opacity: 0.35; }
:root[data-mode="light"] body::after { opacity: 0.1; }
:root[data-mode="light"] .nav { background: rgba(255, 255, 255, 0.78); }
:root[data-mode="light"] .sk-chip img,
:root[data-mode="light"] .skill-item img { background: #f3f4f7; }
:root[data-mode="light"] .flagship-cover image-slot::part(empty) { color: #eef2f8; }

/* view-transition theme wipe: let our clip animation drive the new snapshot */
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }

/* text-animate (word stagger) */
.ta-word { display: inline-block; transition: opacity 0.5s ease, transform 0.5s ease; }
@media (prefers-reduced-motion: reduce) { .ta-word { opacity: 1 !important; transform: none !important; } }

/* nav résumé link */
.nav-resume {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-2); transition: color 0.18s;
}
.nav-resume:hover { color: var(--accent); }
@media (max-width: 720px) { .nav-resume { display: none; } }

/* razzle-dazzle on skill chips */
.sk-chip { transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s; }
.sk-chip:hover {
  border-color: color-mix(in oklab, var(--accent) 55%, var(--border-2));
  transform: translateY(-2px);
  box-shadow: 0 6px 18px color-mix(in oklab, var(--accent) 22%, transparent);
}
.sk-chip img { transition: transform 0.2s; }
.sk-chip:hover img { transform: scale(1.08) rotate(-3deg); }
.brain-head-r { display: flex; align-items: center; gap: 10px; }
.brain-reset {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--text-2); border: 1px solid var(--border-2); background: transparent;
  border-radius: 999px; padding: 3px 9px; transition: color 0.15s, border-color 0.15s;
}
.brain-reset:hover { color: var(--accent); border-color: var(--accent); }
.brain-followup { margin-top: 6px; padding-top: 14px; border-top: 1px dashed var(--border-2); }
.brain-followup-label {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-3); display: block; margin-bottom: 10px;
}
.brain-followup .examples { margin-top: 0; justify-content: flex-start; }

/* "How I build" folded into the systems section */
.flagship-philosophy { margin-top: 72px; padding-top: 40px; border-top: 1px solid var(--border-2); }
.flagship-philosophy .working-quote { margin-top: 14px; }
.working-grid .reveal { height: 100%; }
.working-card { height: 100%; }


/* ============================================================
   BRUTALIST BRANCH — radical reskin, zero feature loss.
   Loads AFTER styles.css / brain.css / gallery.css.
   Scoped to :root[data-theme^="brut"] so the original themes
   are untouched. Sub-themes: brut-paper, brut-acid,
   brut-concrete, brut-noir.
   ============================================================ */

/* ---------- palettes ---------- */
:root[data-theme="brut-paper"] {
  --bg: #f2efe6;
  --bg-2: #e9e5d8;
  --panel: #ffffff;
  --panel-2: #f7f4ea;
  --border: #111111;
  --border-2: #111111;
  --text: #111111;
  --text-2: #2e2e2e;
  --text-3: #6d6a60;
  --accent: #ff4911;
  --accent-2: #2a6fdb;
  --cyan: #2a6fdb;
  --violet: #7b2fbe;
  --emerald: #0e9f6e;
  --amber: #ffb800;
  --rose: #ff4911;
}
:root[data-theme="brut-acid"] {
  --bg: #f4e94d;
  --bg-2: #eadf3c;
  --panel: #fffef2;
  --panel-2: #f8f3c8;
  --border: #111111;
  --border-2: #111111;
  --text: #111111;
  --text-2: #26251c;
  --text-3: #5f5c3a;
  --accent: #ff4911;
  --accent-2: #2a6fdb;
  --cyan: #2a6fdb;
  --violet: #7b2fbe;
  --emerald: #0e7a52;
  --amber: #d9480f;
  --rose: #ff4911;
}
:root[data-theme="brut-concrete"] {
  --bg: #d8d8d3;
  --bg-2: #cbcbc4;
  --panel: #eeeeea;
  --panel-2: #e2e2dc;
  --border: #111111;
  --border-2: #111111;
  --text: #111111;
  --text-2: #2c2c2c;
  --text-3: #5f5f5a;
  --accent: #d9260f;
  --accent-2: #1f52a8;
  --cyan: #1f52a8;
  --violet: #5f2496;
  --emerald: #0c7a52;
  --amber: #b86a00;
  --rose: #d9260f;
}
:root[data-theme="brut-noir"] {
  --bg: #101010;
  --bg-2: #181818;
  --panel: #1c1c1c;
  --panel-2: #242424;
  --border: #f2efe6;
  --border-2: #f2efe6;
  --text: #f2efe6;
  --text-2: #cfccc2;
  --text-3: #8d8a80;
  --accent: #ffd02f;
  --accent-2: #5f9dff;
  --cyan: #5f9dff;
  --violet: #b98aff;
  --emerald: #46d69a;
  --amber: #ffd02f;
  --rose: #ff6b47;
}

/* ---------- ink + hard-shadow tokens ---------- */
:root[data-theme^="brut"] {
  --ink: var(--border);
  --shadow-c: var(--border);
  --hs: 6px 6px 0 var(--shadow-c);
  --hs-sm: 4px 4px 0 var(--shadow-c);
  --hs-hover: 9px 9px 0 var(--accent);
  --font-display: "Archivo Black", "Space Grotesk", system-ui, sans-serif;
}
:root[data-theme^="brut"][data-shadows="off"] {
  --hs: none; --hs-sm: none; --hs-hover: none;
}

/* ---------- global resets ---------- */
:root[data-theme^="brut"] * { border-radius: 0 !important; }
:root[data-theme^="brut"] body::before,
:root[data-theme^="brut"] body::after { display: none; }
:root[data-theme^="brut"] body { font-family: var(--font-sans); }

/* kill italic-serif voice everywhere; display = block caps */
:root[data-theme^="brut"] .section-title,
:root[data-theme^="brut"] .hero-name,
:root[data-theme^="brut"] .flagship-title,
:root[data-theme^="brut"] .flagship-num,
:root[data-theme^="brut"] .t-company,
:root[data-theme^="brut"] .working-title,
:root[data-theme^="brut"] .working-num,
:root[data-theme^="brut"] .sp-title,
:root[data-theme^="brut"] .sp-one,
:root[data-theme^="brut"] .reel-title,
:root[data-theme^="brut"] .hk-name,
:root[data-theme^="brut"] .hk-stat-v,
:root[data-theme^="brut"] .stat-value,
:root[data-theme^="brut"] .metric-v,
:root[data-theme^="brut"] .shipped-name,
:root[data-theme^="brut"] .working-quote,
:root[data-theme^="brut"] .footer-pitch,
:root[data-theme^="brut"] .hero-pitch,
:root[data-theme^="brut"] .flagship-tagline,
:root[data-theme^="brut"] .hack-place,
:root[data-theme^="brut"] .hack-name,
:root[data-theme^="brut"] .kg-center-letter,
:root[data-theme^="brut"] .kg-sys-letter,
:root[data-theme^="brut"] .vid-modal-title,
:root[data-theme^="brut"] .sp-modal-title {
  font-style: normal !important;
}
:root[data-theme^="brut"] .section-title {
  text-transform: uppercase;
  letter-spacing: -0.02em;
  line-height: 0.98;
}
:root[data-theme^="brut"] .section-title em,
:root[data-theme^="brut"] .hero-name .ital,
:root[data-theme^="brut"] .flagship-title .ital {
  font-style: normal;
  color: var(--text);
  background: var(--accent);
  box-shadow: 0.08em 0 0 var(--accent), -0.08em 0 0 var(--accent);
}
:root[data-theme="brut-noir"] .section-title em,
:root[data-theme="brut-noir"] .hero-name .ital,
:root[data-theme="brut-noir"] .flagship-title .ital { color: #101010; }
:root[data-theme^="brut"] .hero-name { text-transform: uppercase; line-height: 0.95; }
:root[data-theme^="brut"] .hero-pitch { font-family: var(--font-sans); font-weight: 500; font-style: normal; }

/* ---------- nav ---------- */
:root[data-theme^="brut"] .nav {
  backdrop-filter: none;
  background: var(--bg);
  border-bottom: 3px solid var(--ink);
}
:root[data-theme^="brut"] .nav-dot { animation: none; border-radius: 0 !important; background: var(--accent); width: 12px; height: 12px; }
:root[data-theme^="brut"] .nav-cta {
  border: 2px solid var(--ink);
  background: var(--accent);
  color: var(--text);
  box-shadow: var(--hs-sm);
  font-weight: 700;
  transition: transform 0.12s, box-shadow 0.12s;
}
:root[data-theme="brut-noir"] .nav-cta { color: #101010; }
:root[data-theme^="brut"] .nav-cta:hover {
  background: var(--text); color: var(--bg);
  transform: translate(-2px, -2px);
  box-shadow: var(--hs);
  border-color: var(--ink);
}
:root[data-theme^="brut"] .theme-toggle { display: none; }

/* ---------- section rhythm ---------- */
:root[data-theme^="brut"] section.bay + section.bay { border-top: 3px solid var(--ink); }
:root[data-theme^="brut"] .eyebrow {
  display: inline-block;
  background: var(--text);
  color: var(--bg);
  padding: 5px 10px;
  letter-spacing: 0.14em;
  font-weight: 500;
}

/* ---------- hero ---------- */
:root[data-theme^="brut"] .hero-portrait {
  border: 3px solid var(--ink);
  box-shadow: var(--hs);
}
:root[data-theme^="brut"] .hero-portrait-meta {
  background: var(--panel);
  border: 2px solid var(--ink);
  padding: 8px 10px;
}

/* ---------- cards: one hard language ---------- */
:root[data-theme^="brut"] .flagship,
:root[data-theme^="brut"] .hack,
:root[data-theme^="brut"] .hk-card,
:root[data-theme^="brut"] .sp-card,
:root[data-theme^="brut"] .shipped-card,
:root[data-theme^="brut"] .reel-card,
:root[data-theme^="brut"] .working-card {
  border: 3px solid var(--ink);
  background: var(--panel);
  box-shadow: var(--hs);
  transition: transform 0.12s, box-shadow 0.12s;
}
:root[data-theme^="brut"] .flagship:hover,
:root[data-theme^="brut"] .hack:hover,
:root[data-theme^="brut"] .hk-card:hover,
:root[data-theme^="brut"] .sp-card:hover,
:root[data-theme^="brut"] .shipped-card:hover,
:root[data-theme^="brut"] .reel-card:hover {
  border-color: var(--ink);
  transform: translate(-3px, -3px);
  box-shadow: var(--hs-hover);
}
:root[data-theme^="brut"] .working-card { background: var(--panel); }
:root[data-theme^="brut"] .flagship-head { border-bottom: 2px dashed var(--ink); }
:root[data-theme^="brut"] .flagship-metrics {
  background: var(--ink);
  border: 2px solid var(--ink);
  gap: 2px;
}
:root[data-theme^="brut"] .flagship-cover { border: 2px solid var(--ink); }
:root[data-theme^="brut"] .flagship-midyear { border: 2px solid var(--ink); background: var(--panel-2); }

/* stats strip */
:root[data-theme^="brut"] .stats { border: 3px solid var(--ink); background: var(--panel); box-shadow: var(--hs); }
:root[data-theme^="brut"] .stat { border-right: 2px solid var(--ink); }
:root[data-theme^="brut"] .stat:last-child { border-right: none; }
:root[data-theme^="brut"] .hk-stats { border: 3px solid var(--ink); background: var(--panel); box-shadow: var(--hs); }
:root[data-theme^="brut"] .hk-stat { border-right: 2px solid var(--ink); }
:root[data-theme^="brut"] .hk-stat:last-child { border-right: none; }

/* timeline */
:root[data-theme^="brut"] .timeline::before { width: 3px; background: var(--ink); }
:root[data-theme^="brut"] .t-item::before {
  background: var(--accent);
  border: 2px solid var(--ink);
  box-shadow: none;
  width: 14px; height: 14px;
}
:root[data-theme^="brut"] .t-logo { border: 2px solid var(--ink); background: #ffffff; }

/* chips & buttons */
:root[data-theme^="brut"] .sk-chip,
:root[data-theme^="brut"] .sp-filter-btn,
:root[data-theme^="brut"] .sp-btn,
:root[data-theme^="brut"] .flagship-stack span,
:root[data-theme^="brut"] .flagship-vocab span,
:root[data-theme^="brut"] .sp-tech span,
:root[data-theme^="brut"] .sp-modal-tech span,
:root[data-theme^="brut"] .shipped-tag {
  border: 2px solid var(--ink) !important;
  background: var(--panel) !important;
  color: var(--text) !important;
  box-shadow: none;
}
:root[data-theme^="brut"] .sp-filter-btn.active,
:root[data-theme^="brut"] .sp-btn:hover {
  background: var(--text) !important;
  color: var(--bg) !important;
}
:root[data-theme^="brut"] .sp-filter-btn { box-shadow: var(--hs-sm); transition: transform 0.1s, box-shadow 0.1s; }
:root[data-theme^="brut"] .sp-filter-btn:hover { transform: translate(-2px, -2px); }
:root[data-theme^="brut"] .sk-chip:hover {
  border-color: var(--ink) !important;
  box-shadow: var(--hs-sm);
  transform: translate(-2px, -2px);
}
:root[data-theme^="brut"] .sk-marquee { -webkit-mask: none; mask: none; }

/* modals */
:root[data-theme^="brut"] .sp-modal-card,
:root[data-theme^="brut"] .vid-modal-card {
  border: 3px solid var(--ink);
  box-shadow: 12px 12px 0 var(--shadow-c);
}
:root[data-theme^="brut"] .sp-modal-close,
:root[data-theme^="brut"] .vid-modal-close {
  border: 2px solid var(--ink);
  background: var(--accent);
  color: var(--text);
}
:root[data-theme="brut-noir"] .sp-modal-close,
:root[data-theme="brut-noir"] .vid-modal-close { color: #101010; }

/* reel */
:root[data-theme^="brut"] .reel-play span {
  border: 2px solid var(--ink);
  background: var(--accent);
  color: var(--text);
  box-shadow: var(--hs-sm);
}
:root[data-theme="brut-noir"] .reel-play span { color: #101010; }
:root[data-theme^="brut"] .reel-place,
:root[data-theme^="brut"] .sp-cat-chip,
:root[data-theme^="brut"] .hk-place {
  border: 2px solid var(--ink) !important;
  background: var(--amber) !important;
  color: #111111 !important;
  box-shadow: none !important;
  font-weight: 700;
}

/* globe: light sphere in a hard frame (dark again in noir) */
:root[data-theme^="brut"] .globe-wrap {
  border: 3px solid var(--ink);
  background: var(--panel);
  box-shadow: var(--hs);
}
:root[data-theme="brut-noir"] .globe-wrap { background: #0b0e13; }
:root[data-theme^="brut"] .globe-pin { border: 2px solid var(--ink); background: var(--panel); }

/* knowledge graph shell */
:root[data-theme^="brut"] .brain-shell,
:root[data-theme^="brut"] .kg-stage {
  border: 3px solid var(--ink) !important;
  background: var(--panel) !important;
  box-shadow: var(--hs);
}
:root[data-theme^="brut"] .brain-reset { border: 2px solid var(--ink); }
:root[data-theme^="brut"] .kg-label { fill: var(--text-2); }
:root[data-theme^="brut"] .kg-link { stroke: var(--text-3); }

/* footer */
:root[data-theme^="brut"] .footer { border-top: 3px solid var(--ink); background: var(--text); color: var(--bg); }
:root[data-theme^="brut"] .footer .footer-pitch,
:root[data-theme^="brut"] .footer a,
:root[data-theme^="brut"] .footer-col,
:root[data-theme^="brut"] .footer-mini { color: var(--bg); }
:root[data-theme^="brut"] .footer a:hover { color: var(--accent); border-color: var(--accent); }

/* easter egg trigger */
:root[data-theme^="brut"] .egg-trigger {
  border: 2px solid var(--ink);
  background: var(--panel);
  box-shadow: var(--hs-sm);
}

/* shiny text: fake it with accent underline instead of gradient shimmer */
:root[data-theme^="brut"] .shiny-text {
  background: none;
  -webkit-background-clip: initial;
  background-clip: initial;
  -webkit-text-fill-color: currentColor;
  animation: none;
  border-bottom: 3px solid var(--accent);
}

/* image-slot frames */
:root[data-theme^="brut"] image-slot::part(frame) { border: 2px solid var(--ink); }

/* selection */
:root[data-theme^="brut"] ::selection { background: var(--accent); color: var(--bg); }


/* ============================================================
   BRUT-MOTION — entrance, scroll & hover animation layer
   Effects: slam, pop, wipe, fade-up, slide, scramble, glitch
   ============================================================ */

/* scroll progress bar */
.bm-progress {
  position: fixed;
  top: 0; left: 0;
  height: 4px;
  width: 100%;
  transform-origin: 0 50%;
  transform: scaleX(0);
  background: var(--accent, #ff4911);
  z-index: 2000;
  pointer-events: none;
}

@media (prefers-reduced-motion: no-preference) {

  /* ---------- base hidden states (only once JS has tagged them) ---------- */
  [data-bm] { will-change: transform, opacity; }

  [data-bm="fade-up"]     { opacity: 0; transform: translateY(28px); }
  [data-bm="slide-left"]  { opacity: 0; transform: translateX(-36px); }
  [data-bm="slide-right"] { opacity: 0; transform: translateX(36px); }
  [data-bm="pop"]         { opacity: 0; transform: scale(0.86); }
  [data-bm="stamp"]       { opacity: 0; transform: rotate(-1.5deg) scale(1.04); }
  [data-bm="title"]       { opacity: 0; transform: translateY(22px); }

  /* ---------- revealed ---------- */
  .bm-in[data-bm="fade-up"] {
    opacity: 1; transform: none;
    transition: opacity 0.6s ease, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    transition-delay: var(--bm-d, 0ms);
  }
  .bm-in[data-bm="slide-left"],
  .bm-in[data-bm="slide-right"] {
    opacity: 1; transform: none;
    transition: opacity 0.55s ease, transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    transition-delay: var(--bm-d, 0ms);
  }
  .bm-in[data-bm="pop"] {
    opacity: 1; transform: none;
    transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.2, 1.6, 0.4, 1);
    transition-delay: var(--bm-d, 0ms);
  }
  .bm-in[data-bm="stamp"] {
    opacity: 1; transform: none;
    transition: opacity 0.35s ease, transform 0.55s cubic-bezier(0.18, 1.35, 0.4, 1);
    transition-delay: var(--bm-d, 0ms);
  }
  @keyframes bmTitleWipe {
    from { clip-path: inset(0 0 96% 0); }
    to   { clip-path: inset(-2% -2% -6% -2%); }
  }
  .bm-in[data-bm="title"] {
    opacity: 1; transform: none;
    transition: opacity 0.5s ease, transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    animation: bmTitleWipe 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  /* accent sweep under the italic word in section titles */
  .section-title em { position: relative; }
  .section-title em::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0.02em;
    height: 0.12em;
    background: var(--accent, #ff4911);
    transform: scaleX(0);
    transform-origin: 0 50%;
    z-index: -1;
  }
  .bm-in.section-title em::after {
    transform: scaleX(1);
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.5s;
  }

  /* ---------- hero entrance (page load) ---------- */
  @keyframes bmHeroSlam {
    0%   { opacity: 0; transform: scale(1.18) rotate(-2deg); }
    62%  { opacity: 1; transform: scale(0.985) rotate(0.4deg); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes bmHeroRise {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes bmHeroSide {
    from { opacity: 0; transform: translateX(44px) rotate(1deg); }
    to   { opacity: 1; transform: none; }
  }
  .bm-hero-slam { animation: bmHeroSlam 0.7s cubic-bezier(0.2, 1.3, 0.35, 1) both; animation-delay: var(--bm-d, 0ms); }
  .bm-hero-rise { animation: bmHeroRise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; animation-delay: var(--bm-d, 0ms); }
  .bm-hero-side { animation: bmHeroSide 0.85s cubic-bezier(0.22, 1, 0.36, 1) both; animation-delay: var(--bm-d, 0ms); }

  /* nav drops in */
  @keyframes bmNavDrop {
    from { transform: translateY(-100%); }
    to   { transform: none; }
  }
  .bm-nav-drop { animation: bmNavDrop 0.55s cubic-bezier(0.22, 1, 0.36, 1) both 0.1s; }

  /* ---------- periodic RGB-split glitch on the hero name ---------- */
  @keyframes bmGlitch {
    0%, 100% { text-shadow: none; transform: none; }
    12% { text-shadow: 3px 0 0 var(--accent, #ff4911), -3px 0 0 #2a6fdb; transform: translateX(-2px) skewX(-1.5deg); }
    24% { text-shadow: -4px 0 0 var(--accent, #ff4911), 4px 0 0 #2a6fdb; transform: translateX(2px); }
    36% { text-shadow: 2px 0 0 var(--accent, #ff4911), -2px 0 0 #2a6fdb; transform: skewX(1deg); }
    48% { text-shadow: none; transform: none; }
  }
  .bm-glitching { animation: bmGlitch 0.5s steps(2, jump-none) 1; }

  /* ---------- hover micro-interactions ---------- */
  .flagship, .hack, .shipped-card, .stat {
    transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease;
  }
  .flagship:hover, .hack:hover, .shipped-card:hover {
    transform: translate(-3px, -3px);
    box-shadow: 6px 6px 0 var(--accent, #ff4911);
  }
  .stat:hover { transform: translateY(-4px); }
  .stat:hover .stat-value { color: var(--accent, #ff4911); transition: color 0.2s ease; }

  .flagship-cover { transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
  .flagship:hover .flagship-cover { transform: rotate(-1.2deg) scale(1.015); }

  .nav-cta { transition: transform 0.18s cubic-bezier(0.2, 1.6, 0.4, 1); }
  .nav-cta:hover { transform: translate(-2px, -2px) rotate(-1deg); }
}

/* scramble targets keep layout stable */
.bm-scramble { display: inline-block; min-height: 1em; }
